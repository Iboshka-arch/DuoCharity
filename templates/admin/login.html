<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DUO Charity Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body login-body">

    <div class="login-card">
        <img src="{{ url_for('static', filename='images/duo-logo.png') }}" alt="DUO Charity" class="login-logo">
        <h1>Admin panel</h1>
        <p class="login-subtitle">DUO Charity boshqaruv paneliga kirish</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-container">
                {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="post" class="login-form">
            <input type="text" name="username" placeholder="Login" required autofocus>
            <input type="password" name="password" placeholder="Parol" required>
            <button type="submit" class="btn btn-primary">Kirish</button>
        </form>

        <div class="login-lang-switcher">
            {% for code, lang in languages.items() %}
            <a href="{{ url_for('set_language', lang_code=code) }}" class="{{ 'active' if code == current_lang }}">
                {{ lang.flag }}
            </a>
            {% endfor %}
        </div>
    </div>

</body>
</html>
