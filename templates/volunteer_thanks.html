{% extends "base.html" %}

{% block title %}{{ t('vf_thanks_title') }} — DUO Charity{% endblock %}

{% block content %}
    <section class="thanks-page">
        <div class="container thanks-page-inner">
            <div class="thanks-icon">🤲</div>
            <h1>{{ t('vf_thanks_title') }}</h1>
            <p class="lead">{{ t('vf_thanks_text') }}</p>
            <p class="lead">{{ t('vf_thanks_bot_note') }}</p>
            <a href="https://t.me/DuoCharityBot" target="_blank" class="btn btn-primary">{{ t('vf_thanks_bot_button') }}</a>
            <a href="{{ url_for('home') }}" class="btn btn-outline">{{ t('vf_thanks_button') }}</a>
        </div>
    </section>
{% endblock %}
